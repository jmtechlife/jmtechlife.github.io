<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Convite Izabela — Escolha uma versão</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap");

      :root {
        --fundo: #f5f0e8;
        --texto: #4d4035;
        --dourado: #b58a3a;
        --dourado-claro: #d8bb7a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at top, #fffdf8, var(--fundo));
        color: var(--texto);
        font-family: Montserrat, sans-serif;
      }

      main {
        max-width: 560px;
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font:
          600 clamp(2.4rem, 7vw, 4rem) "Cormorant Garamond",
          serif;
      }

      p {
        margin: 0 0 32px;
      }

      .botoes {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 14px;
      }

      a {
        min-width: 210px;
        padding: 14px 20px;
        border: 1px solid var(--dourado);
        color: var(--texto);
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        transition: 0.2s ease;
      }

      a:hover,
      a:focus-visible {
        background: var(--dourado);
        color: white;
        outline: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>15 anos da Izabela</h1>
      <p>Escolha uma versão do convite para visualizar.</p>
      <nav class="botoes" aria-label="Versões do convite">
        <a href="classico/index.html"
          >Convite clássico</a
        >
        <a href="premium/index.html">Convite premium</a>
      </nav>
    </main>
  </body>
</html>
